name: scaffold checks

on:
  push:
    paths: ["backend/**", "frontend/**", "cv-service/**", "kitchen-backend/**", "schema/**", "Dockerfile", "fly.toml", ".github/workflows/test.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", "cv-service/**", "kitchen-backend/**", "schema/**", "Dockerfile", "fly.toml", ".github/workflows/test.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check app/coordination app/mvp app/analytics app/demo_auth.py app/server.py scripts tests/test_coordination.py tests/test_mvp*.py tests/test_deployment_auth.py tests/test_application_integration.py eval/dig_in tests/test_dig_in_eval.py
      - run: uv run ruff format --check app/coordination app/mvp app/analytics app/demo_auth.py app/server.py scripts tests/test_coordination.py tests/test_mvp*.py tests/test_deployment_auth.py tests/test_application_integration.py eval/dig_in tests/test_dig_in_eval.py
      - run: uv run python -m scripts.check_repository_hygiene
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check ../frontend/data.js && node --check ../frontend/operator-pages.js && node --check ../frontend/server-alert.js && node --check ../frontend/voice-audio.js && node --check ../frontend/app.js && node --check ../frontend/service-coordination.js && node --check ../frontend/menu-document.js && node --check ../frontend/menu-setup.js && node --check ../frontend/coordination-v1.js && node --check ../frontend/config.js && node --check ../frontend/theme.js
      - run: npm ci --ignore-scripts --prefix ../frontend
      - run: node --test ../frontend/tests/*.test.cjs ../frontend/tests/*.test.mjs
      - run: docker build --tag dig-in-ci ..
      - name: Verify container imports the canonical app and CV contract
        run: docker run --rm --entrypoint .venv/bin/python dig-in-ci -c "from fastapi.testclient import TestClient; from app.server import app; from app.mvp.cv_bridge import producer_contract; assert producer_contract() is not None; client = TestClient(app); assert client.get('/healthz').status_code == 200; assert client.get('/api/v2/cv/context').status_code == 409"

  cv-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [cv-service, kitchen-backend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --locked --python 3.11
      - run: uv run pytest -q
