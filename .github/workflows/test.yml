name: scaffold checks

on:
  push:
    paths: ["backend/**", "frontend/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/test.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check app/coordination app/mvp app/analytics scripts tests/test_coordination.py tests/test_mvp*.py
      - run: uv run ruff format --check app/coordination app/mvp app/analytics scripts tests/test_coordination.py tests/test_mvp*.py
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check ../frontend/app.js && node --check ../frontend/coordination-v1.js && node --check ../frontend/config.js
