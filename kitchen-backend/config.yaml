# dig-in kitchen backend config (BACKEND_SPEC.md section 2)
cv_base_url: "http://localhost:8001"
event_source: http            # http: CV POSTs to /cv/events | ws: backend subscribes to CV's /events
readiness_mode: auto          # auto | confirm
auto_serve_on_removal: true
cv_stale_after_s: 10
allocate_on: submit           # submit | cooking_complete
bays: [A, B, C]
db_path: data/kitchen.db
schema_path: ../schema/events.schema.json
zone_count_tolerance: 0

default_trip_qty: 1           # INGREDIENT_TRIP: qty when the recipe has no line for the zone

# Stock is owned here (dummy values for now). In trip mode the camera only reports
# "a hand reached into zone X"; each trip subtracts the recipe qty for that zone.
zones:
  Z1: {ingredient: lettuce, on_hand: 20}
  Z2: {ingredient: tomato, on_hand: 20}
  Z3: {ingredient: cheese, on_hand: 20}

recipes:                      # qty per trip; 1 for everything for now
  burger: [{zone: Z1, qty: 1}, {zone: Z2, qty: 1}, {zone: Z3, qty: 1}]
  salad: [{zone: Z1, qty: 1}, {zone: Z2, qty: 1}]
  grilled_cheese: [{zone: Z3, qty: 1}]
