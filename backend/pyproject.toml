[project]
name = "kitchen-copilot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.9,<3",
    "websockets>=14,<17",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
live-pipeline = ["pipecat-ai[daily,deepgram,silero]>=0.0.60"]

[dependency-groups]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
